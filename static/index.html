<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWT Agent Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #090c13;
  --surf:     #10141f;
  --surf2:    #181d2e;
  --surf3:    #202840;
  --teal:     #0c6980;
  --teal2:    #0f8faf;
  --amber:    #f5c518;
  --green:    #22c55e;
  --red:      #ef4444;
  --yellow:   #f59e0b;
  --text:     #f0f4f8;
  --text2:    #8fa3b8;
  --text3:    #4d6078;
  --border:   #1a2236;
  --border2:  #243050;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
.logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:-.3px;}
.logo-ring{width:24px;height:24px;border-radius:6px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;}
.hdr-right{display:flex;align-items:center;gap:16px;}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2);display:flex;align-items:center;gap:5px;}
.pill-dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.hdr-date{font-size:11px;color:var(--text3);}

/* ── Layout ── */
.body{display:flex;flex:1;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{width:248px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;}
.sb-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);padding:6px 18px 10px;}
.sb-spacer{flex:1;}
.sb-divider{height:1px;background:var(--border);margin:8px 0;}
.ag-item{display:flex;align-items:center;gap:11px;padding:9px 18px;cursor:pointer;transition:background .12s;position:relative;}
.ag-item:hover{background:var(--surf2);}
.ag-item.active{background:rgba(12,105,128,.13);}
.ag-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--teal);border-radius:0 2px 2px 0;}
.ag-icon{width:34px;height:34px;border-radius:9px;background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background .12s;}
.ag-item.active .ag-icon{background:rgba(12,105,128,.25);}
.ag-info{flex:1;min-width:0;}
.ag-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-sched{font-size:11px;color:var(--text3);margin-top:1px;}
.ag-dot{width:6px;height:6px;background:var(--green);border-radius:50%;flex-shrink:0;box-shadow:0 0 6px var(--green);}

/* ── Main content ── */
.content{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px;}

/* ── Agent header ── */
.ag-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
.ag-hdr-left{display:flex;align-items:center;gap:14px;}
.ag-hdr-icon{width:52px;height:52px;border-radius:13px;background:var(--surf2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.ag-title{font-size:20px;font-weight:700;letter-spacing:-.4px;}
.ag-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
.badge-sched{font-size:11px;color:var(--text2);background:var(--surf2);padding:2px 8px;border-radius:4px;border:1px solid var(--border);}
.badge-tag{font-size:10px;color:var(--teal2);background:rgba(12,105,128,.12);padding:2px 7px;border-radius:3px;letter-spacing:.4px;text-transform:uppercase;}
.ag-desc{font-size:13px;color:var(--text2);line-height:1.6;max-width:520px;margin-top:8px;}

/* ── Buttons ── */
.btn-run{display:flex;align-items:center;gap:7px;background:var(--teal);color:#fff;border:none;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;flex-shrink:0;}
.btn-run:hover{background:var(--teal2);transform:translateY(-1px);box-shadow:0 4px 18px rgba(12,105,128,.45);}
.btn-run:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-run.running{background:var(--surf3);color:var(--amber);}
.btn-sec{display:flex;align-items:center;gap:6px;background:var(--surf2);color:var(--text2);border:1px solid var(--border2);padding:9px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
.btn-sec:hover{background:var(--surf3);color:var(--text);border-color:var(--teal);}
.btn-actions{display:flex;gap:9px;align-items:center;flex-shrink:0;}
.btn-claude{display:flex;align-items:center;gap:7px;background:var(--surf2);color:var(--text3);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:12px;}

/* ── Steps ── */
.steps{display:flex;align-items:center;gap:8px;}
.step{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:6px;font-size:12px;font-weight:500;background:var(--surf2);color:var(--text3);border:1px solid var(--border);transition:all .3s;}
.step-n{width:16px;height:16px;border-radius:50%;background:currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--bg);flex-shrink:0;}
.step.active{background:rgba(245,197,24,.08);color:var(--amber);border-color:rgba(245,197,24,.3);}
.step.done{background:rgba(34,197,94,.08);color:var(--green);border-color:rgba(34,197,94,.25);}
.step.err{background:rgba(239,68,68,.08);color:var(--red);border-color:rgba(239,68,68,.25);}
.step-arrow{color:var(--border2);font-size:14px;}

/* ── Console ── */
.console{background:#080b11;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.con-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--border);}
.con-title{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);}
.con-status{font-size:11px;color:var(--text3);}
.con-body{padding:12px 16px;min-height:60px;max-height:200px;overflow-y:auto;font-family:'SF Mono','Fira Code',monospace;font-size:11.5px;line-height:1.75;}
.con-line{display:flex;gap:10px;}
.con-time{color:var(--text3);flex-shrink:0;width:62px;}
.con-msg{color:#dde5ef;}
.con-msg.step{color:var(--amber);}
.con-msg.ok{color:var(--green);}
.con-msg.err{color:var(--red);}
.con-msg.warn{color:var(--yellow);}
.con-msg.info{color:var(--teal2);}

/* ── Carousel input form ── */
.carousel-form{background:var(--surf2);border:1px solid var(--border2);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.form-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px;}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);}
.form-input{background:var(--surf3);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--teal);}
.form-input::placeholder{color:var(--text3);}
.style-opts{display:flex;gap:8px;}
.style-btn{padding:8px 16px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;background:var(--surf3);color:var(--text2);border:1px solid var(--border2);transition:all .15s;}
.style-btn:hover{border-color:var(--teal);color:var(--text);}
.style-btn.sel{background:rgba(12,105,128,.2);color:var(--teal2);border-color:var(--teal);}

/* ── GMB Result ── */
.result-grid{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start;}
.result-img{border-radius:10px;overflow:hidden;background:var(--surf2);border:1px solid var(--border2);aspect-ratio:1;}
.result-img img{width:100%;height:100%;object-fit:cover;display:block;}
.result-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--text3);font-size:12px;}
.result-card{background:var(--surf2);border:1px solid var(--border2);border-radius:10px;padding:14px;}
.result-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.result-rlabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);}
.badge-ok{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(34,197,94,.12);color:var(--green);}
.badge-fail{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(239,68,68,.12);color:var(--red);}
.dest-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.dest-name{font-size:13px;font-weight:600;}
.tmpl-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(12,105,128,.15);color:var(--teal2);text-transform:capitalize;}
.result-text{font-size:12px;color:var(--text2);line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;}

/* ── Carousel Result ── */
.slides-section{display:flex;flex-direction:column;gap:12px;}
.slides-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.slides-strip::-webkit-scrollbar{height:4px;}
.slides-strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.slide-thumb{flex-shrink:0;width:130px;border-radius:8px;overflow:hidden;border:2px solid var(--border2);cursor:pointer;transition:border-color .15s;background:var(--surf2);}
.slide-thumb:hover,.slide-thumb.active{border-color:var(--teal2);}
.slide-thumb img{width:100%;height:173px;object-fit:cover;display:block;}
.slide-label{font-size:10px;color:var(--text3);padding:4px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slide-preview-wrap{display:flex;gap:14px;align-items:flex-start;}
.slide-preview{flex-shrink:0;width:280px;border-radius:10px;overflow:hidden;border:1px solid var(--border2);}
.slide-preview img{width:100%;display:block;}
.caption-card{flex:1;background:var(--surf2);border:1px solid var(--border2);border-radius:10px;padding:14px;}
.caption-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:8px;}
.caption-text{font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;}
.copy-btn{margin-top:10px;padding:6px 12px;background:var(--surf3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;}
.copy-btn:hover{border-color:var(--teal);color:var(--text);}
.download-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.dl-btn{font-size:11px;padding:5px 11px;background:var(--surf3);border:1px solid var(--border2);border-radius:5px;color:var(--teal2);text-decoration:none;transition:border-color .15s;}
.dl-btn:hover{border-color:var(--teal);}

/* ── Progress bar ── */
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .4s;}

/* ── Section title ── */
.sec-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:7px;}

/* ── GMB History ── */
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.hist-card{background:var(--surf2);border:1px solid var(--border);border-radius:9px;overflow:hidden;transition:border-color .2s;}
.hist-card:hover{border-color:var(--teal);}
.hist-img{width:100%;height:120px;object-fit:cover;display:block;background:var(--surf3);}
.hist-no-img{height:120px;display:flex;align-items:center;justify-content:center;background:var(--surf3);font-size:28px;}
.hist-body{padding:10px;}
.hist-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.hist-dest{font-size:12px;font-weight:600;}
.hist-time{font-size:11px;color:var(--text3);}
.hist-preview{font-size:11.5px;color:var(--text3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── All History view ── */
.hist-filters{display:flex;gap:6px;margin-bottom:14px;}
.hist-filter{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:var(--surf2);color:var(--text2);border:1px solid var(--border2);transition:all .15s;}
.hist-filter:hover{border-color:var(--teal);color:var(--text);}
.hist-filter.active{background:rgba(12,105,128,.2);color:var(--teal2);border-color:var(--teal);}
.run-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.run-card{background:var(--surf2);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s;}
.run-card:hover{border-color:var(--teal);}
.run-thumb{width:100%;height:130px;object-fit:cover;display:block;background:var(--surf3);}
.run-no-thumb{height:130px;display:flex;align-items:center;justify-content:center;background:var(--surf3);font-size:36px;}
.run-body{padding:11px 12px;}
.run-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.wf-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
.wf-gmb{background:rgba(245,197,24,.12);color:var(--amber);}
.wf-carousel{background:rgba(12,105,128,.15);color:var(--teal2);}
.run-status-ok{font-size:10px;color:var(--green);}
.run-status-fail{font-size:10px;color:var(--red);}
.run-topic{font-size:12.5px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.run-meta{font-size:11px;color:var(--text3);}
.run-detail{background:var(--surf2);border:1px solid var(--border2);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.run-detail-hdr{display:flex;align-items:center;justify-content:space-between;}
.run-detail-title{font-size:15px;font-weight:700;}
.btn-back{padding:5px 12px;background:var(--surf3);border:1px solid var(--border2);border-radius:6px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;}
.btn-back:hover{border-color:var(--teal);color:var(--text);}
.run-detail-body{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start;}
.run-detail-img{border-radius:8px;overflow:hidden;border:1px solid var(--border2);}
.run-detail-img img{width:100%;display:block;}
.run-detail-info{display:flex;flex-direction:column;gap:8px;}
.run-kv{display:flex;flex-direction:column;gap:3px;}
.run-kv-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);}
.run-kv-val{font-size:12.5px;color:var(--text2);line-height:1.55;}
.run-kv-val.pre{white-space:pre-wrap;word-break:break-word;font-size:11.5px;max-height:180px;overflow-y:auto;}
.empty-state{text-align:center;padding:48px 24px;color:var(--text3);font-size:13px;}
.empty-icon{font-size:40px;margin-bottom:12px;}

/* ── Not runnable ── */
.info-box{background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:18px 22px;display:flex;align-items:flex-start;gap:14px;}
.info-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
.info-text{font-size:13px;color:var(--text2);line-height:1.6;}
.info-text strong{color:var(--text);display:block;margin-bottom:3px;font-size:14px;}
code{background:var(--surf3);padding:1px 5px;border-radius:3px;font-size:11px;font-family:'SF Mono',monospace;}

/* ── Carousel History ── */
.ch-section{display:flex;flex-direction:column;gap:14px;}
.ch-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ch-filters{display:flex;gap:6px;}
.ch-filter{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:var(--surf2);color:var(--text2);border:1px solid var(--border2);transition:all .15s;}
.ch-filter:hover{border-color:var(--teal);color:var(--text);}
.ch-filter.active{background:rgba(12,105,128,.2);color:var(--teal2);border-color:var(--teal);}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.ch-card{background:var(--surf2);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s;}
.ch-card:hover{border-color:var(--border2);}
.ch-card.open{border-color:var(--teal2);}
.ch-thumb{width:100%;height:136px;object-fit:cover;display:block;background:var(--surf3);cursor:pointer;}
.ch-thumb-ph{height:136px;display:flex;align-items:center;justify-content:center;background:var(--surf3);font-size:36px;cursor:pointer;}
.ch-body{padding:10px 12px;}
.ch-topic{font-size:12.5px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-meta{font-size:11px;color:var(--text3);margin-bottom:8px;}
.ch-btns{display:flex;gap:6px;}
.ch-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surf3);color:var(--text2);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.ch-btn:hover{border-color:var(--teal);color:var(--text);}
.ch-btn.primary{background:rgba(12,105,128,.15);border-color:rgba(12,105,128,.35);color:var(--teal2);}
.ch-btn.primary:hover{background:rgba(12,105,128,.25);}
.ch-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888);border-color:transparent;color:#fff;}
.ch-btn.ig:hover{filter:brightness(1.1);color:#fff;}
.ch-btn.ig:disabled{opacity:.6;cursor:not-allowed;filter:grayscale(.4);}
.ch-btn.posted{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.4);color:var(--green);}
.ig-post-status{font-size:11px;color:var(--text3);margin-top:4px;}
.ig-post-status a{color:var(--teal2);text-decoration:none;}
.ig-post-status a:hover{text-decoration:underline;}
.ch-expanded{background:var(--surf);border:1px solid var(--teal2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.ch-exp-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ch-exp-title{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-exp-date{font-size:11px;color:var(--text3);}
.ch-slides-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.ch-slides-scroll::-webkit-scrollbar{height:4px;}
.ch-slides-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.ch-slide-item{flex-shrink:0;display:flex;flex-direction:column;gap:5px;align-items:center;}
.ch-slide-img{width:108px;height:135px;object-fit:cover;border-radius:7px;border:1px solid var(--border2);display:block;}
.ch-slide-label{font-size:10px;color:var(--text3);text-align:center;}
.ch-slide-dl{font-size:10px;padding:3px 8px;background:var(--surf3);border:1px solid var(--border2);border-radius:4px;color:var(--teal2);text-decoration:none;text-align:center;width:100%;display:block;transition:border-color .15s;}
.ch-slide-dl:hover{border-color:var(--teal);}

/* ── Growth Calendar ── */
.gc-section{display:flex;flex-direction:column;gap:16px;}
.gc-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.gc-week-label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);}
.gc-copy-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;background:rgba(12,105,128,.15);border:1px solid rgba(12,105,128,.35);color:var(--teal2);transition:all .15s;}

.shimmer{background:linear-gradient(90deg,var(--surf2) 25%,var(--surf3) 50%,var(--surf2) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:4px;}
@keyframes shim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

     ships in the global <style>, but .mp-* CSS is injected at runtime. */

  .lp-btn{min-height:38px;padding:8px 12px !important;font-size:12px !important;}
}

@media (max-width: 480px) {

<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-ring">🌍</div>
    DWT Agent Hub
  </div>
  <div class="hdr-right">
    <div class="hdr-date" id="hdrDate"></div>
    <div class="pill"><div class="pill-dot"></div> Live on Railway</div>
  </div>
</header>

<div class="body">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let agents = [];
let selected = null;   // agent object or {id:'history'}
let running = false;
let runState = {};
let carouselInsp = 5;
let histFilter = 'all';
let histRuns = [];
let histDetail = null;
let carouselFilter = 'all';
let carouselRuns = [];
let carouselExpanded = null;
let growthCalendar = null;
let growthHistory = [];
let growthFilter = 'all';

document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('en-IN',{
  weekday:'short',day:'numeric',month:'short',year:'numeric'
});

async function init() {
  const resp = await fetch('/api/gmb/agents');
  agents = await resp.json();
  renderSidebar();
  selectAgent('gmb-autopilot');
}

// ── Sidebar ───────────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<div class="sb-label">Agents</div>';
  agents.forEach(a => {
    const isActive = selected?.id === a.id;
    html += `
      <div class="ag-item${isActive ? ' active' : ''}" onclick="selectAgent('${a.id}')">
        <div class="ag-icon">${a.icon}</div>
        <div class="ag-info">
          <div class="ag-name">${a.name}</div>
          <div class="ag-sched">${a.schedule}</div>
        </div>
        ${a.runnable ? '<div class="ag-dot"></div>' : ''}
      </div>`;
  });
  html += `
    <div class="sb-spacer"></div>
    <div class="sb-divider"></div>
    <div class="sb-label">Data</div>
    <div class="ag-item${selected?.id === 'history' ? ' active' : ''}" onclick="selectHistory()">
      <div class="ag-icon">🗂</div>
      <div class="ag-info">
        <div class="ag-name">Run History</div>
        <div class="ag-sched">All past runs</div>
      </div>
    </div>`;
  sb.innerHTML = html;
}

function selectAgent(id) {
  selected = agents.find(a => a.id === id);
  if (!selected) return;
  histDetail = null;
  renderSidebar();
  renderAgentContent();
  if (selected.id === 'gmb-autopilot') { loadGmbHistory(); renderGmbAuditShell(); renderGmbCompetitorShell(); renderGmbReviewsShell(); }
  if (selected.id === 'carousel-pipeline') loadCarouselHistory();
  if (selected.id === 'weekly-growth') loadGrowthCalendar();
  if (selected.id === 'landing-pages') loadLandingPages();
  if (selected.id === 'marketing-posts') loadMarketingPosts();
  if (selected.id === 'skills-library') loadSkillsLibrary();
  if (selected.id === 'instagram-pipeline') igTab('calendar');
}

function selectHistory() {
  selected = { id: 'history' };
  histDetail = null;
  renderSidebar();
  renderHistoryView();
  fetchHistory();
}

// ── Agent content ─────────────────────────────────────────────────────────
function renderAgentContent() {
  const c = document.getElementById('content');
  const a = selected;
  const tags = a.tags.map(t => `<span class="badge-tag">${t}</span>`).join('');

  let actionHtml = '';
  if (!a.runnable) {
    actionHtml = `<div class="btn-claude">🖥 Run in Claude Code</div>`;
  } else if (a.id === 'gmb-autopilot') {
    actionHtml = `<div class="btn-actions">
      <button class="btn-run" id="runBtn" onclick="startRun()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Run Now
      </button>
      <button class="btn-sec" onclick="loadGmbHistory()">📋 Refresh History</button>
    </div>`;
  } else if (a.id === 'instagram-pipeline') {
    actionHtml = `<div class="btn-actions">
      <button class="btn-run" onclick="igTab('calendar')">🗓 Calendar</button>
      <button class="btn-sec" onclick="igTab('queue')">📥 Approval Queue</button>
      <button class="btn-sec" onclick="igGenerate()">✨ Generate Weeks</button>
      <button class="btn-sec" onclick="igRenderSpecs()">🎨 Render Specs</button>
    </div>`;
  } else if (a.id === 'weekly-growth') {
    actionHtml = `<div class="btn-actions">
      <button class="btn-run" id="runBtn" onclick="startRun()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Generate This Week's Plan
      </button>
      <button class="btn-sec" onclick="loadGrowthCalendar()">↻ Refresh</button>
    </div>`;
  }

  c.innerHTML = `
    <div class="ag-hdr">
      <div>
        <div class="ag-hdr-left">
          <div class="ag-hdr-icon">${a.icon}</div>
          <div>
            <div class="ag-title">${a.name}</div>
            <div class="ag-meta"><span class="badge-sched">⏱ ${a.schedule}</span>${tags}</div>
          </div>
        </div>
        <div class="ag-desc">${a.description}</div>
      </div>
      ${actionHtml}

let gmbAuditState = { busy: false, result: null, error: null };

function renderGmbAuditShell() {
  const w = document.getElementById('gmb-audit-wrap');
  if (!w) return;
  w.innerHTML = `
    <style>
      .ga-card { background:var(--surf2); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:18px; }

      }

      .ga-score-num { font-size:22px; font-weight:700; color:var(--text); line-height:1; }
      .ga-score-max { font-size:10px; color:var(--text3); margin-top:2px; }
      .ga-grade { font-size:24px; font-weight:800; color:var(--text); padding:0 6px; }

      .ga-snapshot { display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--text2); }
      .ga-snapshot strong { color:var(--text); }

      .ga-breakdown { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:18px; }
      .ga-dim { background:var(--surf); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
      .ga-dim-name { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); margin-bottom:4px; }
      .ga-dim-bar { height:5px; background:var(--surf3); border-radius:3px; overflow:hidden; margin-top:4px; }
      .ga-dim-fill { height:100%; background:var(--teal); border-radius:3px; transition:width .4s; }
      .ga-dim-fill.f-good { background:#22c55e; }
      .ga-dim-fill.f-warn { background:var(--amber); }
      .ga-dim-fill.f-bad { background:var(--red); }
      .ga-dim-val { font-size:12.5px; color:var(--text); font-weight:600; margin-top:2px; }

      .ga-issue.sev-low  { border-left-color:var(--teal2); }
      .ga-issue-sev { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:2px 6px; border-radius:3px; flex-shrink:0; height:fit-content; }
      .ga-issue-sev.sev-high { background:rgba(239,68,68,.15); color:#f87171; }
      .ga-issue-sev.sev-med  { background:rgba(245,158,11,.15); color:var(--amber); }
      .ga-issue-sev.sev-low  { background:rgba(15,143,175,.15); color:var(--teal2); }

          ${gmbAuditState.busy ? '<div class="spin"></div> Auditing...' : '🔍 Run Audit'}
        </button>

function renderGmbAuditBody() {
  if (gmbAuditState.busy) {
    return `<div style="color:var(--text3);font-size:12.5px;padding:20px 0;text-align:center">Fetching profile info, reviews, posts, photos, Q&A from Google Business Profile (~5-10s)...</div>`;
  }
  if (gmbAuditState.error) {
    return `<div style="color:#f87171;font-size:12.5px;padding:12px;background:rgba(239,68,68,.06);border-radius:7px">⚠ ${gmbAuditState.error}</div>`;
  }
  if (!gmbAuditState.result) {
    return `<div style="color:var(--text3);font-size:12.5px;padding:8px 0">Click <strong>Run Audit</strong> to score your GBP profile across 5 dimensions and get prioritized fixes.</div>`;
  }
  const r = gmbAuditState.result;
  const gradeClass = `b-${r.grade.charAt(0)}`;

  const dimensions = [
    ['profile_completeness', 'Profile'],
    ['visual_assets', 'Photos'],
    ['post_cadence', 'Posts'],
    ['review_engagement', 'Reviews'],
    ['qa_coverage', 'Q&A'],
  ];

  const dimHtml = dimensions.map(([key, label]) => {
    const d = r.breakdown[key];
    const pct = d.max ? (d.score / d.max) : 0;
    const fillClass = pct >= 0.8 ? 'f-good' : pct >= 0.5 ? 'f-warn' : 'f-bad';
    return `
      <div class="ga-dim">
        <div class="ga-dim-name">${label}</div>
        <div class="ga-dim-val">${d.score} / ${d.max}</div>
        <div class="ga-dim-bar"><div class="ga-dim-fill ${fillClass}" style="width:${(pct*100).toFixed(0)}%"></div></div>
      </div>
    `;
  }).join('');

  const issuesHtml = (r.issues || []).map(i => `
    <div class="ga-issue sev-${i.severity}">
      <span class="ga-issue-sev sev-${i.severity}">${i.severity}</span>
      <div class="ga-issue-text"><strong>${i.area}:</strong> ${i.fix}</div>
    </div>
  `).join('');

  const t = r.totals || {};
  const snap = r.profile_snapshot || {};

  return `
    <div class="ga-score-row">
      <div class="ga-score-circle ${gradeClass}">
        <div class="ga-score-num">${r.score}</div>
        <div class="ga-score-max">/ ${r.max_score}</div>
      </div>
      <div class="ga-grade">${r.grade}</div>
      <div class="ga-snapshot">
        <div><strong>${snap.title || 'Profile'}</strong> · ${snap.primary_category || 'No category'}</div>
        <div>${snap.website || 'No website'} · ${snap.phone || 'No phone'}</div>
        <div style="color:var(--text3);max-width:360px">${snap.description_preview ? snap.description_preview + '…' : 'No description'}</div>
      </div>
    </div>

    <div class="ga-breakdown">${dimHtml}</div>

    <div class="ga-totals">
      <span>📝 <strong>${t.posts ?? 0}</strong> posts</span>
      <span>📸 <strong>${t.photos ?? 0}</strong> photos</span>
      <span>⭐ <strong>${t.reviews ?? 0}</strong> reviews</span>
      <span>❓ <strong>${t.questions ?? 0}</strong> Q&A</span>
      <span>🏷 <strong>${t.categories ?? 0}</strong> categories</span>
      <span>🧳 <strong>${t.services ?? 0}</strong> services</span>
      <span>🏷 <strong>${t.attributes ?? 0}</strong> attributes</span>
    </div>

    <div class="ga-issues-title">Top fixes (sorted by severity)</div>
    ${issuesHtml || '<div style="color:#22c55e;font-size:12.5px;padding:8px 0">✓ No issues — profile is in great shape.</div>'}
  `;
}

async function runGmbAudit() {
  if (gmbAuditState.busy) return;
  gmbAuditState.busy = true;
  gmbAuditState.error = null;
  renderGmbAuditShell();
  try {
    const resp = await fetch('/api/gmb/audit');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Audit failed');
    gmbAuditState.result = data;
  } catch (e) {
    gmbAuditState.error = e.message;
  } finally {
    gmbAuditState.busy = false;
    renderGmbAuditShell();
  }
}

    `).join('') || '<div style="color:var(--text3);font-size:12px">No standout quotes.</div>'}

}

async function runCompetitorScrape(force) {
  if (gmbCompState.busy) return;
  gmbCompState.busy = true;
  gmbCompState.error = null;
  renderGmbCompetitorShell();
  try {
    const resp = await fetch('/api/gmb/competitors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ force_refresh: !!force }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Competitor scrape failed');
    gmbCompState.result = data;
  } catch (e) {
    gmbCompState.error = e.message;
  } finally {
    gmbCompState.busy = false;
    renderGmbCompetitorShell();
  }
}

async function runThemeExtraction() {
  if (gmbThemeState.busy) return;
  gmbThemeState.busy = true;
  gmbThemeState.error = null;
  renderGmbCompetitorShell();

    const resp = await fetch('/api/gmb/keyword-themes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Theme extraction failed');
    gmbThemeState.result = data;
  } catch (e) {
    gmbThemeState.error = e.message;
  } finally {
    gmbThemeState.busy = false;
    renderGmbCompetitorShell();
  }
}

// ── GMB Review Auto-Reply (draft → approve → post) ─────────────────────────
let gmbReviewsState = { busy: false, reviews: null, error: null, edits: {}, posting: {}, postedOk: {} };

function renderGmbReviewsShell() {
  const w = document.getElementById('gmb-reviews-wrap');
  if (!w) return;
  w.innerHTML = `
    <div class="ga-card">
      <div class="ga-hdr">
        <div class="ga-title">💬 Reviews — Auto-Draft & Reply</div>
        <button class="ga-run-btn" onclick="loadGmbReviews()" ${gmbReviewsState.busy ? 'disabled' : ''}>
          ${gmbReviewsState.busy ? '<div class="spin"></div> Drafting...' : '✨ Load & Draft Replies'}
        </button>
      </div>
      <div style="font-size:11.5px;color:var(--text3);margin-bottom:10px">
        Pulls recent reviews from GBP. Claude drafts a personalized reply for each unreplied review. You edit, then click Post to publish. Nothing posts automatically.
      </div>
      <div id="gmb-reviews-body">${renderGmbReviewsBody()}</div>
    </div>
  `;
}

function renderGmbReviewsBody() {
  if (gmbReviewsState.busy) return `<div style="color:var(--text3);font-size:12.5px;padding:20px 0;text-align:center">Fetching reviews from GBP + Claude drafting replies (~30-90s for batch)...</div>`;
  if (gmbReviewsState.error) return `<div style="color:#f87171;font-size:12.5px;padding:12px;background:rgba(239,68,68,.06);border-radius:7px">⚠ ${gmbReviewsState.error}</div>`;
  if (!gmbReviewsState.reviews) return `<div style="color:var(--text3);font-size:12.5px;padding:8px 0">Click <strong>Load & Draft Replies</strong> to fetch reviews + auto-draft for unreplied ones.</div>`;

  const reviews = gmbReviewsState.reviews;
  if (!reviews.length) return `<div style="color:var(--text3);font-size:12.5px">No reviews returned.</div>`;

  const pending = reviews.filter(r => r.needs_reply);
  const replied = reviews.filter(r => !r.needs_reply);

  return `
    <div style="font-size:11.5px;color:var(--text2);margin-bottom:12px">
      <strong>${pending.length}</strong> pending · <strong>${replied.length}</strong> already replied · <strong>${reviews.length}</strong> total
    </div>
    ${pending.length ? `<div class="ga-issues-title">Needs reply</div>${pending.map(renderReviewCard).join('')}` : '<div style="color:#22c55e;font-size:12.5px;margin-bottom:14px">✓ All recent reviews are replied to.</div>'}
    ${replied.length ? `<div class="ga-issues-title" style="margin-top:18px">Already replied (showing ${Math.min(5, replied.length)})</div>${replied.slice(0, 5).map(renderReviewCard).join('')}` : ''}
  `;
}

function renderReviewCard(r) {
  const stars = '★'.repeat(r.stars || 0) + '☆'.repeat(5 - (r.stars || 0));
  const starColor = r.stars >= 4 ? '#22c55e' : r.stars >= 3 ? 'var(--amber)' : 'var(--red)';
  const editKey = r.review_id;
  const currentDraft = editKey in gmbReviewsState.edits ? gmbReviewsState.edits[editKey] : (r.draft_reply || '');
  const posting = gmbReviewsState.posting[editKey];
  const posted = gmbReviewsState.postedOk[editKey];
  const isAlreadyReplied = !r.needs_reply;

  return `
    <div style="background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">
        ${r.reviewer_photo ? `<img src="${r.reviewer_photo}" style="width:32px;height:32px;border-radius:50%;flex-shrink:0" onerror="this.style.display='none'">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">${(r.reviewer_name||'?').charAt(0)}</div>`}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-weight:600;color:var(--text);font-size:12.5px">${r.reviewer_name}</span>
            <span style="color:${starColor};font-size:11.5px;letter-spacing:1px">${stars}</span>
            <span style="color:var(--text3);font-size:11px">${relTime(r.created_at)}</span>
          </div>
          <div style="color:var(--text2);font-size:12px;line-height:1.5;margin-top:4px;white-space:pre-wrap">${(r.comment || '<em style="color:var(--text3)">(no comment)</em>')}</div>
        </div>
      </div>

      ${isAlreadyReplied ? `
        <div style="background:var(--surf3);border-left:3px solid var(--teal2);padding:8px 11px;border-radius:5px;margin-top:8px">
          <div style="font-size:10px;font-weight:600;color:var(--teal2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">DWT replied</div>
          <div style="font-size:11.5px;color:var(--text2);line-height:1.5;white-space:pre-wrap">${r.owner_reply}</div>
        </div>
      ` : posted ? `
        <div style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:10px 12px;border-radius:6px;margin-top:8px">
          <div style="font-size:11.5px;color:#22c55e;font-weight:600">✓ Reply posted successfully</div>
        </div>
      ` : `
        <div style="margin-top:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)">Claude draft (editable)</span>
            <button onclick="redraftReview('${editKey}')" style="font-size:10.5px;padding:3px 8px;background:var(--surf3);color:var(--text2);border:1px solid var(--border2);border-radius:4px;cursor:pointer">🔄 Re-draft</button>
          </div>
          <textarea
            id="reply-${editKey}"
            oninput="gmbReviewsState.edits['${editKey}'] = this.value"
            style="width:100%;padding:9px 11px;background:var(--surf3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:12.5px;font-family:inherit;line-height:1.5;min-height:64px;resize:vertical"
            rows="3"
          >${currentDraft.replace(/</g, '&lt;')}</textarea>
          <div style="display:flex;gap:8px;margin-top:6px;justify-content:flex-end">
            <button onclick="postReviewReply('${editKey}')" ${posting ? 'disabled' : ''} style="padding:6px 14px;background:${posting ? 'var(--surf3)' : 'var(--teal)'};color:white;border:none;border-radius:6px;font-size:11.5px;font-weight:600;cursor:${posting ? 'not-allowed' : 'pointer'};display:inline-flex;align-items:center;gap:5px">
              ${posting ? '<div class="spin"></div> Posting...' : '📤 Post Reply'}
            </button>
          </div>
        </div>
      `}
    </div>
  `;
}

async function loadGmbReviews() {
  if (gmbReviewsState.busy) return;
  gmbReviewsState.busy = true;
  gmbReviewsState.error = null;
  renderGmbReviewsShell();
  try {
    const resp = await fetch('/api/gmb/reviews?draft=true&limit=20');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Load failed');
    gmbReviewsState.reviews = data.reviews || [];
  } catch (e) {
    gmbReviewsState.error = e.message;
  } finally {
    gmbReviewsState.busy = false;
    renderGmbReviewsShell();
  }
}

async function redraftReview(reviewId) {
  const r = (gmbReviewsState.reviews || []).find(x => x.review_id === reviewId);
  if (!r) return;
  const ta = document.getElementById(`reply-${reviewId}`);
  if (ta) ta.disabled = true;
  try {
    const resp = await fetch('/api/gmb/reviews/draft', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comment: r.comment, stars: r.stars, reviewer_name: r.reviewer_name }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Draft failed');
    gmbReviewsState.edits[reviewId] = data.draft_reply;
  } catch (e) {
    alert('Re-draft failed: ' + e.message);
  } finally {
    if (ta) ta.disabled = false;
    renderGmbReviewsShell();
  }
}

async function postReviewReply(reviewId) {
  const r = (gmbReviewsState.reviews || []).find(x => x.review_id === reviewId);
  if (!r) return;
  const replyText = (reviewId in gmbReviewsState.edits) ? gmbReviewsState.edits[reviewId] : (r.draft_reply || '');
  if (!replyText.trim()) { alert('Reply is empty.'); return; }
  if (!confirm(`Post this reply to ${r.reviewer_name}'s review on Google?\n\n"${replyText}"`)) return;

  gmbReviewsState.posting[reviewId] = true;
  renderGmbReviewsShell();
  try {
    const resp = await fetch('/api/gmb/reviews/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ review_name: r.review_name, reply_text: replyText }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Post failed');
    gmbReviewsState.postedOk[reviewId] = true;
  } catch (e) {
    alert('Post failed: ' + e.message);
  } finally {
    gmbReviewsState.posting[reviewId] = false;
    renderGmbReviewsShell();
  }
}

async function loadGmbHistory() {
  const grid = document.getElementById('hist-grid');

    const { posts } = await resp.json();
    if (!posts?.length) {
      grid.innerHTML = '<p style="color:var(--text3);font-size:13px;grid-column:1/-1">No posts found.</p>';
      return;

    const DESTS = ['Kashmir','Vietnam','Dubai','Thailand','Ladakh','Singapore','Amarnath'];
    grid.innerHTML = posts.map(p => {
      const dest = DESTS.find(d => p.summary?.includes(d)) || 'Post';
      return `
        <div class="hist-card">
          ${p.mediaUrl
            ? `<img class="hist-img" src="${p.mediaUrl}" alt="${dest}" loading="lazy">`
            : `<div class="hist-no-img">🗺️</div>`}
          <div class="hist-body">
            <div class="hist-top"><span class="hist-dest">${dest}</span><span class="hist-time">${relTime(p.createTime)}</span></div>
            <div class="hist-preview">${(p.summary||'').slice(0,100)}</div>

}

async function fetchHistory() {

  try {
    const wf = histFilter === 'all' ? '' : `?workflow=${histFilter}`;
    const resp = await fetch(`/api/history${wf}`);
    const { runs } = await resp.json();
    histRuns = runs || [];
    renderRunGrid();
  } catch (e) {
    const g = document.getElementById('run-grid');
    if (g) g.innerHTML = `<p style="color:var(--red);font-size:13px;grid-column:1/-1">Failed to load history: ${e.message}</p>`;

function setHistFilter(f) {
  histFilter = f;
  // re-render filter buttons
  document.querySelectorAll('.hist-filter').forEach(el => {
    el.classList.toggle('active', el.textContent.toLowerCase().includes(f) || (f === 'all' && el.textContent === 'All Runs'));
  });
  fetchHistory();
}

function renderRunGrid() {
  const wrap = document.getElementById('run-grid-wrap');
  if (!wrap) return;

  if (!histRuns.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>No runs yet. Run an agent to see history here.</div>`;

  }

  wrap.innerHTML = `<div class="run-grid" id="run-grid">${histRuns.map((r, i) => renderRunCard(r, i)).join('')}</div>`;
}

function renderRunCard(r, i) {
  const isGmb = r.workflow === 'gmb';
  const res = r.result || {};
  const thumbUrl = isGmb
    ? (res.image_url || res.local_image_url || null)
    : (res.slides?.[0]?.url || null);
  const topic = r.topic || '—';
  const ok = r.status === 'complete';
  const dt = r.completed_at || r.created_at;

  return `
    <div class="run-card" onclick="showRunDetail(${i})">
      ${thumbUrl
        ? `<img class="run-thumb" src="${thumbUrl}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="run-no-thumb" style="${thumbUrl ? 'display:none' : ''}">${isGmb ? '📍' : '🎠'}</div>
      <div class="run-body">
        <div class="run-top">
          <span class="wf-badge ${isGmb ? 'wf-gmb' : 'wf-carousel'}">${isGmb ? 'GMB' : 'Carousel'}</span>
          <span class="${ok ? 'run-status-ok' : 'run-status-fail'}">${ok ? '✓ Done' : '✗ Failed'}</span>
        </div>
        <div class="run-topic">${topic}</div>
        <div class="run-meta">${relTime(dt)}</div>
      </div>
    </div>`;
}

function showRunDetail(i) {
  const r = histRuns[i];
  if (!r) return;
  histDetail = r;
  const c = document.getElementById('content');
  const isGmb = r.workflow === 'gmb';
  const res = r.result || {};
  const ok = r.status === 'complete';
  const dt = r.completed_at || r.created_at;

  let detailBody = '';
  if (isGmb) {
    const imgUrl = res.image_url || res.local_image_url;
    detailBody = `
      <div class="run-detail-body">
        <div>
          <div class="run-detail-img">
            ${imgUrl
              ? `<img src="${imgUrl}" alt="GMB Image">`
              : `<div style="height:200px;display:flex;align-items:center;justify-content:center;background:var(--surf3);font-size:40px">🗺️</div>`}
          </div>
          ${res.post_name ? `<div style="font-size:11px;color:var(--text3);margin-top:6px;word-break:break-all">${res.post_name}</div>` : ''}
        </div>
        <div class="run-detail-info">
          <div class="run-kv">
            <div class="run-kv-label">Destination</div>
            <div class="run-kv-val">${res.destination || '—'} <span class="tmpl-badge" style="margin-left:6px">${res.template || ''}</span></div>

            <div class="run-kv-label">Posted</div>

          </div>

          </div>
        </div>

  } else {

      const fname = s.filename || `slide-${si+1}.png`;
      const dlUrl = s.url?.startsWith('http') ? s.url : `${s.url}?download=true`;
      const label = fname.replace('slide-','').replace('.png','').replace(/^\d+-/,'') || `${si+1}`;
      return `<div class="ch-slide-item">
        <img class="ch-slide-img" src="${s.url}" loading="lazy">
        <div class="ch-slide-label">${label}</div>
        <a class="ch-slide-dl" href="${dlUrl}" download="${fname}">↓ Download</a>
      </div>`;
    }).join('');
    detailBody = `
      <div class="run-detail-info" style="grid-column:1/-1">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">

            <div class="run-kv-label">Topic</div>

        </div>
        ${slides.length ? `<div class="ch-slides-scroll">${slideItems}</div>` : ''}

      <div style="display:grid;grid-template-columns:${isGmb ? '200px 1fr' : '1fr'};gap:16px">

    const map = {'all':'All','7':'Last 7 Days','30':'Last 30 Days','month':'This Month'};
    el.classList.toggle('active', el.textContent === map[f]);
  });
  carouselExpanded = null;
  renderCarouselRuns();
}

// ── Instagram posting (manual per-carousel) ──────────────────────────────
function _renderIGButton(r) {
  const ig = (r.result || {}).instagram;
  if (ig && ig.success && ig.permalink) {
    return `<a class="ch-btn posted" href="${ig.permalink}" target="_blank">✓ Posted to Instagram</a>`;
  }
  return `<button class="ch-btn ig" id="ig-btn-${r.id}" onclick="postCarouselToInstagram('${r.id}', this)">📸 Post to Instagram</button>`;
}

function _renderIGStatus(r) {
  const ig = (r.result || {}).instagram;
  if (!ig) return '';
  if (ig.success && ig.permalink) {
    return `<div class="ig-post-status">Posted ${_relTime(ig.posted_at)} · <a href="${ig.permalink}" target="_blank">view on Instagram ↗</a></div>`;
  }
  if (ig.error) {
    return `<div class="ig-post-status" style="color:var(--red)">Last attempt failed: ${ig.error.slice(0, 120)}</div>`;
  }
  return '';
}

async function postCarouselToInstagram(runId, btnEl) {
  if (!confirm('Post this carousel to Instagram now?')) return;
  const originalText = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = '⏳ Posting…';
  try {
    const resp = await fetch(`/api/instagram/post/${runId}`, { method: 'POST' });
    const data = await resp.json();
    if (resp.ok && data.success) {
      btnEl.textContent = '✓ Posted!';
      btnEl.classList.add('posted');
      btnEl.classList.remove('ig');
      setTimeout(loadCarouselHistory, 1500);
    } else {
      const err = (data.detail || data.error || 'Unknown error').toString();
      alert(`Instagram post failed:\n\n${err}`);
      btnEl.disabled = false;
      btnEl.textContent = originalText;
    }
  } catch (e) {
    alert(`Network error: ${e.message}`);
    btnEl.disabled = false;
    btnEl.textContent = originalText;
  }
}

function _filterCarouselRuns() {
  if (carouselFilter === 'all') return carouselRuns;
  const now = Date.now();
  if (carouselFilter === '7')  return carouselRuns.filter(r => now - new Date(r.created_at) < 7*86400000);
  if (carouselFilter === '30') return carouselRuns.filter(r => now - new Date(r.created_at) < 30*86400000);
  if (carouselFilter === 'month') {
    const m = new Date().getMonth(), y = new Date().getFullYear();
    return carouselRuns.filter(r => { const d = new Date(r.created_at); return d.getMonth()===m && d.getFullYear()===y; });
  }
  return carouselRuns;
}

function renderCarouselRuns() {
  const grid = document.getElementById('ch-grid');
  if (!grid) return;
  const runs = _filterCarouselRuns();
  if (!runs.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🎠</div>No carousel runs yet for this period.</div>`;
    return;
  }
  let html = '';
  runs.forEach((r, i) => {
    const res = r.result || {};
    const slides = res.slides || [];
    const thumb = slides[0]?.url || null;
    const isOpen = carouselExpanded === i;
    html += `
      <div class="ch-card${isOpen?' open':''}">
        ${thumb
          ? `<img class="ch-thumb" src="${thumb}" onclick="toggleCarouselRun(${i})" loading="lazy">`
          : `<div class="ch-thumb-ph" onclick="toggleCarouselRun(${i})">🎠</div>`}
        <div class="ch-body">
          <div class="ch-topic">${r.topic || 'Carousel'}</div>
          <div class="ch-meta">${slides.length} slides · ${fmtDate(r.created_at)}</div>
          <div class="ch-btns">
            <button class="ch-btn" onclick="toggleCarouselRun(${i})">${isOpen ? '▲ Collapse' : '▼ View Slides'}</button>
            <a class="ch-btn primary" href="/api/slides/${r.id}/download-all.zip" download="carousel-${r.id}.zip">⬇ Download All</a>
            ${_renderIGButton(r)}
          </div>
          ${_renderIGStatus(r)}
        </div>
      </div>`;
    if (isOpen) {
      html += renderCarouselExpanded(r);
    }
  });
  grid.innerHTML = html;
}

function toggleCarouselRun(i) {
  carouselExpanded = carouselExpanded === i ? null : i;
  renderCarouselRuns();
}

function renderCarouselExpanded(r) {
  const res = r.result || {};
  const slides = res.slides || [];
  const slideItems = slides.map((s, si) => {
    const fname = s.filename || `slide-${si+1}.png`;
    const dlUrl = s.url?.startsWith('http') ? s.url : `${s.url}?download=true`;
    const label = fname.replace('slide-','').replace('.png','').replace(/^\d+-/,'') || `slide ${si+1}`;
    return `
      <div class="ch-slide-item">
        <img class="ch-slide-img" src="${s.url}" loading="lazy">
        <div class="ch-slide-label">${label}</div>
        <a class="ch-slide-dl" href="${dlUrl}" download="${fname}">↓ Download</a>
      </div>`;
  }).join('');

  return `
    <div class="ch-expanded" style="grid-column:1/-1">
      <div class="ch-exp-hdr">
        <span class="ch-exp-title">${r.topic || 'Carousel'}</span>
        <span class="ch-exp-date">${fmtDate(r.created_at)} · ${slides.length} slides</span>
        <a class="ch-btn primary" href="/api/slides/${r.id}/download-all.zip" download="carousel-${r.id}.zip">⬇ Download All ${slides.length} Slides</a>
        ${_renderIGButton(r)}
      </div>
      ${_renderIGStatus(r)}
      ${res.caption ? `<div style="font-size:12px;color:var(--text2);line-height:1.6;background:var(--surf2);padding:10px 12px;border-radius:7px;white-space:pre-wrap">${res.caption}</div>` : ''}
      <div class="ch-slides-scroll">${slideItems}</div>
    </div>`;
}

// ── GMB Run ───────────────────────────────────────────────────────────────
async function startGmbRun() {
  running = true;
  runState = {};
  showRunUI(3);
  setStatus('Running...');
  log('Starting GMB Autopilot...', 'info');
  const btn = lockBtn('Running...');

  try {
    const { run_id } = await (await fetch('/api/gmb/run?force=true', { method: 'POST' })).json();
    log(`Run ID: ${run_id}`, 'info');
    await streamRun(run_id, handleGmbEvent);
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
  }

  running = false;
  setStatus('Done');
  unlockBtn(btn, 'Run Now');
}

function handleGmbEvent(evt) {
  const { step, message, data, progress } = evt;
  if (progress) setProgress(progress);

  if (step === 'preparing')      { setStep(1,'active'); log(`[Step 1] ${message}`, 'step'); }
  else if (step === 'prepared')  { setStep(1,'done'); runState.prepared = data; log(`✓ ${data?.destination} / ${data?.template}`, 'ok'); }
  else if (step === 'generating_image') { setStep(2,'active'); log(`[Step 2] ${message}`, 'step'); }
  else if (step === 'image_ready') {
    setStep(2,'done');
    if (data?.image_url) { runState.imageUrl = data.image_url; log('✓ Image ready', 'ok'); }
    else if (data?.error) log(`⚠ Image failed: ${data.error}`, 'warn');
    else log(`⚠ ${message}`, 'warn');
  }
  else if (step === 'posting')   { setStep(3,'active'); log(`[Step 3] ${message}`, 'step'); }
  else if (step === 'complete') {
    setStep(3,'done');
    if (data?.skipped) { log('ℹ Already posted today — skipped.', 'info'); }
    else {
      log('✓ Posted to Google Business Profile!', 'ok');
      runState.result = data;
      // Use imgbb permanent URL if available, fallback to local path
      runState.imageUrl = data?.image_url || data?.local_image_url || runState.imageUrl;
      showGmbResult();
    }
    setTimeout(loadGmbHistory, 2500);
  }
  else if (step === 'error') { markStepErr(); log(`✗ ${message}`, 'err'); }
}

function showGmbResult() {
  const panel = document.getElementById('result-panel');
  if (!panel) return;
  const { prepared, imageUrl, result } = runState;
  const destination = result?.destination || prepared?.destination;
  const template = result?.template || prepared?.template;
  const postText = result?.post_text || prepared?.post_text;

  panel.innerHTML = `
    <div class="result-grid">
      <div class="result-img">
        ${imageUrl
          ? `<img src="${imageUrl}" alt="Generated image">`
          : `<div class="result-img-ph"><span style="font-size:32px">🖼</span><span>No image generated</span></div>`}
      </div>
      <div class="result-card">
        <div class="result-card-hdr">
          <div>
            ${destination ? `<div class="dest-row"><span class="dest-name">${destination}</span><span class="tmpl-badge">${template||''}</span></div>` : ''}
            <div class="result-rlabel">Post Content</div>
          </div>
          <span class="badge-ok">✓ Posted to GBP</span>
        </div>
        <div class="result-text">${postText || ''}</div>
      </div>
    </div>`;
  panel.classList.remove('hidden');
}

async function startGrowthRun() {
  running = true;
  runState = {};
  showRunUI(4);
  setStatus('Running...');
  log('Starting Weekly Growth Strategy with live Apify intel...', 'info');
  const btn = lockBtn('Generating...');

  try {
    const { run_id } = await (await fetch('/api/growth/run', { method: 'POST' })).json();
    log(`Run ID: ${run_id}`, 'info');
    await streamRun(run_id, handleGrowthEvent);
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
  }

  running = false;
  setStatus('Done');
  unlockBtn(btn, "Generate This Week's Plan");
}

function handleGrowthEvent(evt) {
  const { step, message, data, progress } = evt;
  if (progress) setProgress(progress);
  if (step === 'fetching_ig')          { setStep(1,'active'); log(`[Step 1] ${message}`, 'step'); }
  else if (step === 'researching_web') { setStep(1,'done'); setStep(2,'active'); log(`[Step 2] ${message}`, 'step'); }
  else if (step === 'analyzing') {
    setStep(2,'done'); setStep(3,'active');
    log(`[Step 3] ${message}`, 'step');
    if (data?.intel_summary) {
      const s = data.intel_summary;
      log(`✓ Followers: ${s.followers?.toLocaleString?.() || s.followers} | engagement: ${s.engagement_rate_pct}% | competitors: ${s.competitors_analyzed}/4 | web articles: ${s.web_articles_found ?? 0}`, 'ok');
    }
  }
  else if (step === 'generating')      { setStep(3,'done'); setStep(4,'active'); log(`[Step 4] ${message}`, 'step'); }
  else if (step === 'complete') {
    setStep(4,'done');
    log(`✓ 7-day calendar ready for ${data?.week_of || ''}`, 'ok');
    setTimeout(loadGrowthCalendar, 1000);
  }
  else if (step === 'error') { markStepErr(); log(`✗ ${message}`, 'err'); }
}

function _escape(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);
}

function _renderWebPanel(research) {

  return `
    <div class="gc-web">
      <div class="gc-web-hdr">

        <span class="gc-web-title">Trending Travel Articles (Web Research)</span>

function copyGrowthRow(idx) {
  const item = (growthCalendar?.calendar || [])[idx];
  if (!item) return;
  const txt = [
    `${item.day} ${item.date} — ${item.content_type}`,
    `Topic: ${item.topic}`,
    `Hook: ${item.hook}`,
    `CTA: ${item.cta}`,
    `Virality: ${item.virality_score}/10 | Lead: ${item.lead_score}/10`,
    `Agent: ${item.assigned_agent}${item.dwt_package ? ' | Package: ' + item.dwt_package : ''}`,
    item.notes ? `Notes: ${item.notes}` : '',
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(txt).then(() => {
    const btns = document.querySelectorAll('.gc-row-copy');
    if (btns[idx]) { btns[idx].textContent = '✓'; btns[idx].classList.add('ok'); setTimeout(() => { btns[idx].textContent = 'Copy'; btns[idx].classList.remove('ok'); }, 1200); }
  });
}

function copyGrowthAll() {
  const cal = growthCalendar?.calendar || [];
  if (!cal.length) return;
  const headers = ['Day','Date','Type','Topic','Hook','CTA','Virality','Lead','Agent','Package','Notes'];
  const rows = cal.map(i => [
    i.day || '', i.date || '', i.content_type || '', i.topic || '', i.hook || '',
    i.cta || '', i.virality_score ?? '', i.lead_score ?? '',
    i.assigned_agent || '', i.dwt_package || '', i.notes || ''
  ].map(v => String(v).replace(/\t/g, ' ').replace(/\n/g, ' ')).join('\t'));
  const txt = [headers.join('\t'), ...rows].join('\n');
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('gcCopyAll');
    if (btn) { btn.textContent = '✓ Copied — paste in Sheets/Excel'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = '📋 Copy Whole Table'; btn.classList.remove('ok'); }, 1800); }
  });
}

function _filterGrowthRuns() {
  if (growthFilter === 'all') return growthHistory;
  const now = Date.now();
  if (growthFilter === '7')   return growthHistory.filter(r => now - new Date(r.created_at) < 7 *86400000);
  if (growthFilter === '30')  return growthHistory.filter(r => now - new Date(r.created_at) < 30*86400000);
  if (growthFilter === 'month') {
    const d0 = new Date(); const m = d0.getMonth(), y = d0.getFullYear();
    return growthHistory.filter(r => { const d = new Date(r.created_at); return d.getMonth()===m && d.getFullYear()===y; });
  }
  return growthHistory;
}

function setGrowthFilter(f) {
  growthFilter = f;
  _renderGrowthHistoryList();
}

      Past Calendars
    </div>
    <div class="ch-filters" style="margin-bottom:10px">
      <button class="ch-filter${growthFilter==='all'?' active':''}" onclick="setGrowthFilter('all')">All</button>
      <button class="ch-filter${growthFilter==='7'?' active':''}" onclick="setGrowthFilter('7')">Last 7 Days</button>
      <button class="ch-filter${growthFilter==='30'?' active':''}" onclick="setGrowthFilter('30')">Last 30 Days</button>
      <button class="ch-filter${growthFilter==='month'?' active':''}" onclick="setGrowthFilter('month')">This Month</button>
    </div>
    <div class="gc-hist">${items}</div>
  </div>`;
}

function loadGrowthCalendarById(run_id) {
  const r = growthHistory.find(x => x.run_id === run_id);

}

let lpState = { briefs: [], pages: [], supported_types: [], currentMode: 'list' };

async function loadLandingPages() {

async function buildAllLandingPages() {
  const btn = event.target;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Building...';
  try {
    const resp = await fetch('/api/landing-pages/build-all', { method: 'POST' });
    const data = await resp.json();
    if (data.succeeded) {
      alert(`✓ Built ${data.succeeded} of ${data.total} pages successfully.${data.failed ? `\n${data.failed} failed.` : ''}`);
      await loadLandingPages();
    } else {
      alert('Build failed. Check details:\n\n' + JSON.stringify(data, null, 2).slice(0,400));
    }
  } catch (e) {
    alert('Network error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function rebuildBrief(briefFilename) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    // POST build-all is simplest; for single rebuild we'd POST /build but that needs the brief JSON
    const resp = await fetch('/api/landing-pages/build-all', { method: 'POST' });
    const data = await resp.json();
    const myResult = (data.results || []).find(r => r.brief === briefFilename);
    if (myResult?.success) {
      btn.textContent = '✓';
      setTimeout(() => loadLandingPages(), 600);
    } else {
      alert('Build failed: ' + (myResult?.error || 'unknown error'));
      btn.disabled = false;
      btn.textContent = '🔨 Re-build';
    }
  } catch (e) {
    alert('Network error: ' + e.message);
    btn.disabled = false;
    btn.textContent = '🔨 Re-build';
  }
}

async function deleteLandingPage(filename) {
  if (!confirm(`Delete ${filename}? (The brief is preserved — only the generated HTML is removed.)`)) return;
  try {
    await fetch(`/api/landing-pages/page/${filename}`, { method: 'DELETE' });
    await loadLandingPages();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

function renderSkillResult() {
  if (skillsState.busy) {
    return `
      <div class="sk-info-line" style="margin-top:14px;padding:12px;background:var(--surf);border-radius:7px;text-align:center">
        Gemini is running <strong>${skillsState.selectedId}</strong> — reading skill markdown, auto-loading referenced brand files, generating output...
      </div>`;
  }
  if (skillsState.error) {
    return `<div style="margin-top:14px;color:#f87171;font-size:12.5px;padding:12px;background:rgba(239,68,68,.06);border-radius:7px">⚠ ${skillsState.error}</div>`;
  }
  if (!skillsState.result) return '';

  const r = skillsState.result;
  const out = r.output;
  let outStr;
  if (typeof out === 'string') outStr = out;
  else { try { outStr = JSON.stringify(out, null, 2); } catch { outStr = String(out); }}

  const refs = r.referenced_files || [];
  return `
    <div style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)">
          Output · ${outStr.length} chars · ${r.model_used}
        </div>
        <button onclick="navigator.clipboard.writeText(${JSON.stringify(outStr)}); this.textContent='✓ Copied'" style="padding:5px 11px;background:var(--surf3);border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-size:11px;cursor:pointer">📋 Copy</button>
      </div>
      ${refs.length ? `<div class="sk-info-line" style="margin-bottom:6px">Auto-loaded ${refs.length} reference file(s): ${refs.map(f => `<code>${f}</code>`).join(' · ')}</div>` : '<div class="sk-info-line" style="margin-bottom:6px;color:#f59e0b">⚠ No reference files were auto-loaded for this skill.</div>'}
      <div class="sk-output">${outStr.replace(/</g,'&lt;')}</div>
    </div>
  `;
}

async function runSkill() {
  if (skillsState.busy) return;
  if (!skillsState.selectedId) { alert('Pick a skill or agent first.'); return; }
  skillsState.busy = true;
  skillsState.error = null;
  skillsState.result = null;
  renderSkillsLibrary();
  try {
    const resp = await fetch('/api/skills/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: skillsState.selectedId,
        args: skillsState.args,
        expect_json: skillsState.expectJson,
        smart: skillsState.smart,
      }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Skill execution failed');
    skillsState.result = data;
  } catch (e) {
    skillsState.error = e.message;
  } finally {
    skillsState.busy = false;
    renderSkillsLibrary();
  }
}

async function smartGenerate() {
  if (mpState.smartBusy) return;
  const req = document.getElementById('mp-smart-request').value.trim();
  if (!req) {
    alert('Please describe what you want.');
    return;
  }
  mpState.smartBusy = true;
  mpState.smartResult = null;
  renderMarketingPosts();

  try {
    const resp = await fetch('/api/marketing-posts/smart-generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        request: req,
        count: mpState.smartCount,
        model_provider: mpState.selectedModel,
      }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Smart generate failed');
    mpState.smartResult = data;
  } catch (e) {
    mpState.smartResult = { intent_summary: '', posts: [], errors: [{ destination: '—', inspiration_id: '—', error: e.message }] };
  } finally {
    mpState.smartBusy = false;
    renderMarketingPosts();
    setTimeout(loadMarketingPosts, 1200);
  }
}

async function generateMarketingPost() {
  if (mpState.generating) return;
  const dest = document.getElementById('mp-destination').value.trim();
  if (!dest) {
    alert('Please enter a destination.');
    return;
  }
  if (!mpState.selectedInsp) {
    alert('Please select an inspiration.');
    return;
  }

  const priceLine = document.getElementById('mp-price').value.trim();
  const departures = document.getElementById('mp-departures').value.trim();
  const highlightsRaw = document.getElementById('mp-highlights').value.trim();
  const highlights = highlightsRaw
    ? highlightsRaw.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 5)
    : [];

  const details = {};
  if (priceLine) details.price_line = priceLine;
  if (departures) details.departures = departures;
  if (highlights.length) details.highlights = highlights;

  const btn = document.getElementById('mp-gen-btn');

  const label = document.getElementById('mp-gen-label');

      </div>

  try {
    const resp = await fetch('/api/marketing-posts/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        destination: dest,
        inspiration_id: mpState.selectedInsp,
        model_provider: mpState.selectedModel,

function _relTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - new Date(ts);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (h < 1) return 'just now';
  if (h < 24) return `${h}h ago`;
  return `${d}d ago`;
}
