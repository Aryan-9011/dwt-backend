async function startCarouselRun() {
  running = true;
  runState = { slides: [], caption: '' };
  showRunUI(3);
  setStatus('Running...');
  log('Starting Carousel Pipeline...', 'info');
  const btn = lockBtn('Generating...');

  const topicHint = document.getElementById('topicInput')?.value?.trim() || '';
  const body = { inspiration: carouselInsp, topic_hint: topicHint || null };

  try {
    const resp = await fetch('/api/run/carousel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const { run_id } = await resp.json();
    log(`Run ID: ${run_id}`, 'info');
    await streamRun(run_id, handleCarouselEvent);
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
  }

  running = false;
  setStatus('Done');
  unlockBtn(btn, 'Generate Carousel');
}

function handleCarouselEvent(evt) {
  const { step, message, data, progress } = evt;
  if (progress) setProgress(progress);

  if (step === 'researching') {
    setStep(1, 'active');
    log(`[Research] ${message}`, 'step');
    if (data?.topic) log(`✓ Topic: ${data.topic}`, 'ok');
  }
  else if (step === 'writing_brief') {
    setStep(1, 'done');
    setStep(2, 'active');
    log(`[Design] ${message}`, 'step');
  }
  else if (step === 'generating_slides') {
    setStep(2, 'active');
    log(message, '');
  }
  else if (step === 'complete') {
    setStep(2, 'done');
    setStep(3, 'done');
    log(`✓ ${message}`, 'ok');
    if (data?.slides) { runState.slides = data.slides; runState.caption = data.caption || ''; }
    showCarouselResult();
    setTimeout(loadCarouselHistory, 1500);
  }
  else if (step === 'error') { markStepErr(); log(`✗ ${message}`, 'err'); }
}

function showCarouselResult() {
  const panel = document.getElementById('result-panel');
  if (!panel) return;
  const { slides, caption } = runState;
  if (!slides?.length) return;

  const thumbs = slides.map((s, i) =>
    `<div class="slide-thumb${i===0?' active':''}" id="thumb-${i}" onclick="previewSlide(${i})">
       <img src="${s.url}" alt="Slide ${i+1}" loading="lazy">
       <div class="slide-label">Slide ${i+1}</div>
     </div>`
  ).join('');

  const dlLinks = slides.map((s,i) =>
    `<a class="dl-btn" href="${s.url}?download=true" download="slide-${i+1}.png">↓ Slide ${i+1}</a>`
  ).join('');

  panel.innerHTML = `
    <div class="slides-section">
      <div class="sec-title">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Generated Slides (${slides.length})
      </div>
      <div class="slides-strip" id="slides-strip">${thumbs}</div>
      <div class="slide-preview-wrap">
        <div class="slide-preview">
          <img id="slide-big" src="${slides[0].url}" alt="Slide preview">
        </div>
        <div class="caption-card">
          <div class="caption-label">Instagram Caption</div>
          <div class="caption-text" id="caption-text">${caption || 'Caption not available.'}</div>
          <button class="copy-btn" onclick="copyCaption()">📋 Copy caption</button>
          <div class="download-row">${dlLinks}</div>
        </div>
      </div>
    </div>`;
  panel.classList.remove('hidden');
}

function previewSlide(i) {
  const slides = runState.slides;
  if (!slides?.[i]) return;
  document.getElementById('slide-big').src = slides[i].url;
  document.querySelectorAll('.slide-thumb').forEach((el, j) => el.classList.toggle('active', j === i));
}

function copyCaption() {
  const text = document.getElementById('caption-text')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = '📋 Copy caption', 2000); }
  });
}

// ── Shared run helpers ────────────────────────────────────────────────────
function showRunUI(steps) {
  document.getElementById('steps')?.classList.remove('hidden');
  document.getElementById('console')?.classList.remove('hidden');
  document.getElementById('result-panel')?.classList.add('hidden');
  const body = document.getElementById('con-body');
  if (body) body.innerHTML = '';
  setProgress(0);
  for (let n = 1; n <= steps; n++) setStep(n, '');
}

async function streamRun(run_id, handler) {
  await new Promise(resolve => {
    const es = new EventSource(`/api/stream/${run_id}`);
    es.onmessage = (e) => {
      try {
        const evt = JSON.parse(e.data);
        handler(evt);
        if (evt.step === 'complete' || evt.step === 'error') { es.close(); resolve(); }
      } catch {}
    };
    es.onerror = () => { es.close(); resolve(); };
  });
}

function lockBtn(label) {
  const btn = document.getElementById('runBtn');
  if (btn) { btn.disabled = true; btn.className = 'btn-run running'; btn.innerHTML = `<div class="spin"></div> ${label}`; }
  return btn;
}

function unlockBtn(btn, label) {
  if (!btn) return;
  btn.disabled = false;
  btn.className = 'btn-run';
  btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> ${label}`;
}

function log(text, type) {
  const body = document.getElementById('con-body');
  if (!body) return;
  const line = document.createElement('div');
  line.className = 'con-line';
  line.innerHTML = `<span class="con-time">${timeStr()}</span><span class="con-msg ${type}">${text}</span>`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

function setStep(n, state) {
  const el = document.getElementById(`s${n}`);
  if (el) el.className = `step${state ? ' '+state : ''}`;
}

function setProgress(pct) {
  const el = document.getElementById('prog-fill');
  if (el) el.style.width = `${pct}%`;
}

function setStatus(s) {
  const el = document.getElementById('con-status');
  if (el) el.textContent = s;
}

function markStepErr() {
  [1,2,3].forEach(n => {
    const el = document.getElementById(`s${n}`);
    if (el?.classList.contains('active')) setStep(n, 'err');
  });
}

function timeStr() {
  return new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function relTime(iso) {
  if (!iso) return '—';
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-IN', {
    day:'numeric', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit',
  });
}

init();

// ── Instagram Pipeline — the draft gate ──────────────────────────────────

let igWeeks = [], igWeekSel = null;

async function igGenerate() {
  const n = prompt('How many weeks to generate?  (1-8)', '3');
  if (!n) return;
  const host = igHost();
  host.innerHTML = `<div class="ig-empty">Generating ${n} weeks from the live departure board…</div>`;
  try {
    const r = await fetch(`/api/ig/calendars/generate?weeks=${encodeURIComponent(n)}`, {method:'POST'});
    const j = await r.json();
    igWeekSel = (j.weeks || [])[0] || null;
    await loadIgCalendar();
  } catch (e) { host.innerHTML = `<div class="ig-empty">failed: ${e.message}</div>`; }
}

function igWeekBar() {
  if (!igWeeks.length) return '';
  return `<div class="cal-weeks">` + igWeeks.map(w =>
    `<button class="cal-wk ${w.week_of === igWeekSel ? 'cal-wk-on' : ''}"
       onclick="igWeekSel='${w.week_of}';loadIgCalendar()">
       <b>${w.week_label || w.week_of}</b><span>${w.posts} posts</span></button>`).join('') + `</div>`;
}

let igView = 'calendar';
function igTab(v) { igView = v; v === 'calendar' ? loadIgCalendar() : loadIgPipeline(); }

function igHost() {
  const el = document.getElementById('content');
  let h = document.getElementById('igHost');
  if (!h) { h = document.createElement('div'); h.id = 'igHost'; el.appendChild(h); }
  return h;
}

async function loadIgCalendar() {
  const host = igHost();
  host.innerHTML = '<div class="ig-empty">Loading calendar…</div>';
  try {
    igWeeks = ((await (await fetch('/api/ig/calendars')).json()).items) || [];
    if (!igWeekSel && igWeeks.length) igWeekSel = igWeeks[0].week_of;
    const url = igWeekSel ? `/api/ig/calendar?week_of=${igWeekSel}` : '/api/ig/calendar';
    const c = await (await fetch(url)).json();
    if (c.detail) { host.innerHTML = `<div class="ig-empty"><b>No calendar yet.</b><br>
      Click <b>✨ Generate Weeks</b> to build them from your live departure board.</div>`; return; }
    const rows = c.days.map(d => {
      const st = d.status === 'ready' ? '<span class="ig-state ig-ok">READY</span>'
               : d.status === 'needs-filming' ? '<span class="ig-state ig-bad">FILM IT</span>' : '';
      const fmt = d.format === '—' ? '' : `<span class="cal-fmt cal-${d.format.split(' ')[0].toLowerCase()}">${d.format}</span>`;
      const lang = d.lang === '—' ? '' : `<span class="cal-lang">${d.lang}</span>`;
      return `<tr>
        <td class="cal-day"><b>${d.day}</b><br><span>${d.date}</span></td>
        <td class="cal-time">${d.time}</td>
        <td>${fmt} ${lang} ${st}
          <div class="cal-angle">${d.angle}</div>
          <div class="cal-detail">${d.detail}</div></td></tr>`;
    }).join('');
    const deps = c.departures.map(d =>
      `<tr><td class="cal-dep-date">${d.date}</td><td class="cal-dep-days">${d.days}d</td>
       <td><b>${d.name}</b>${d.note ? `<div class="cal-detail">${d.note}</div>` : ''}</td></tr>`).join('');
    const fixes = c.fix_outside_calendar.map(f => `<li>${f}</li>`).join('');
    const eng = c.engagement;
    host.innerHTML = `
      <div class="cal-rules">
        <div><b>Language</b> ${c.rules.language}</div>
        <div><b>Framing</b> ${c.rules.framing}</div>
        <div><b>Format</b> ${c.rules.format}</div>
        <div class="cal-warn"><b>Reality check</b> ${c.rules.reality}</div>
      </div>
      ${igWeekBar()}
      <h3 class="cal-h">${c.week_label || ('Week of ' + c.week_of)}</h3>
      <table class="cal-table">${rows}</table>
      <h3 class="cal-h">Departures driving the week</h3>
      <table class="cal-table cal-dep">${deps}</table>
      <h3 class="cal-h">Engagement — 20 min/day, before posting</h3>
      <div class="cal-eng">
        <div><b>Reach</b> ${eng.reach.join(' · ')}</div>
        <div><b>Peers</b> ${eng.peers.join(' · ')}</div>
        <div><b>Watch</b> ${eng.watch.join(' · ')}</div>
        <div class="cal-warn">${eng.note}<br>${eng.missing}</div>
      </div>
      <h3 class="cal-h">Fix outside the calendar</h3>
      <ul class="cal-fix">${fixes}</ul>`;
  } catch (e) { host.innerHTML = `<div class="ig-empty">Could not load calendar: ${e.message}</div>`; }
}

async function igRenderSpecs() {
  const host = document.getElementById('igHost');
  host.innerHTML = '<div class="ig-empty">Rendering…</div>';
  try {
    const r = await fetch('/api/ig/specs'); const j = await r.json();
    const todo = (j.items || []).filter(s => !s.rendered);
    if (!todo.length) { host.innerHTML = '<div class="ig-empty">All specs already rendered.</div>'; return; }
    for (const s of todo) {
      host.innerHTML = `<div class="ig-empty">Rendering ${s.slug}…</div>`;
      await fetch('/api/ig/render', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({file: s.file})});
    }
  } catch (e) { host.innerHTML = `<div class="ig-empty">failed: ${e.message}</div>`; }
  loadIgPipeline();
}
let igItems = [];

async function loadIgPipeline() {
  const el = document.getElementById('content');
  const host = document.getElementById('igHost') || (() => {
    const d = document.createElement('div'); d.id = 'igHost'; el.appendChild(d); return d;
  })();
  host.innerHTML = '<div class="ig-empty">Loading queue…</div>';
  try {
    const r = await fetch('/api/ig/pending');
    const j = await r.json();
    igItems = j.items || [];
    renderIgPipeline();
  } catch (e) {
    host.innerHTML = `<div class="ig-empty">Could not load queue: ${e.message}</div>`;
  }
}

function igStateClass(s) {
  return s === 'APPROVED' ? 'ig-ok' : s === 'FAIL' ? 'ig-bad' : s === 'PASS' ? 'ig-pass' : 'ig-warn';
}

function renderIgPipeline() {
  const host = document.getElementById('igHost');
  if (!igItems.length) {
    host.innerHTML = `<div class="ig-empty">
      <b>Nothing waiting.</b><br>
      Render a spec locally — <code>python3 scripts/ig_render.py reference/ig-specs/&lt;spec&gt;.json</code>
      — and it appears here for approval.</div>`;
    return;
  }
  host.innerHTML = igItems.map(it => {
    const g = it.gate || {};
    const thumbs = it.slides.slice(0, 10).map((s, i) =>
      `<img class="ig-thumb" src="/api/ig/slides/${it.slug}/${s}" title="slide ${i + 1}"
            onclick="window.open(this.src,'_blank')">`).join('');
    const fails = (g.caption_fails || []).map(f => `<li>${f}</li>`).join('');
    const canPublish = it.state === 'APPROVED';
    return `<div class="ig-card">
      <div class="ig-top">
        <div>
          <div class="ig-slug">${it.slug}</div>
          <div class="ig-cap">${(it.caption_preview || '').replace(/</g, '&lt;')}</div>
        </div>
        <span class="ig-state ${igStateClass(it.state)}">${it.state}</span>
      </div>
      <div class="ig-meta">
        <span>${it.slide_count} slides</span>
        <span>caption: <b>${g.caption_verdict || '—'}</b></span>
        <span>human: <b>${g.human_score != null ? g.human_score.toFixed(1) : '—'}</b></span>
        <span>${it.language || ''} ${it.brand ? '· ' + it.brand : ''}</span>
      </div>
      ${fails ? `<ul class="ig-fails">${fails}</ul>` : ''}
      <div class="ig-strip">${thumbs}</div>
      <div class="ig-acts">
        <button class="btn-sec" onclick="igAct('check','${it.slug}')">Re-check</button>
        <button class="btn-run" onclick="igAct('approve','${it.slug}')"
          ${it.state === 'APPROVED' ? 'disabled' : ''}>Approve</button>
        <button class="btn-sec" onclick="igPublish('${it.slug}', true)"
          ${canPublish ? '' : 'disabled'}>Publish (dry run)</button>
        <button class="btn-sec ig-live" onclick="igPublish('${it.slug}', false)"
          ${canPublish ? '' : 'disabled'}>Publish LIVE</button>
        <button class="btn-sec ig-rej" onclick="igAct('reject','${it.slug}')">Reject</button>
      </div>
      <pre class="ig-out" id="out-${it.slug}"></pre>
    </div>`;
  }).join('');
}

async function igAct(action, slug) {
  const out = document.getElementById('out-' + slug);
  if (out) out.textContent = action + '…';
  try {
    const r = await fetch(`/api/ig/${action}/${slug}`, { method: 'POST' });
    const j = await r.json();
    if (out) out.textContent = j.output || j.detail || JSON.stringify(j);
  } catch (e) {
    if (out) out.textContent = 'error: ' + e.message;
  }
  loadIgPipeline();
}

async function igPublish(slug, dry) {
  if (!dry && !confirm(`Publish "${slug}" LIVE to Instagram now?\n\nThis cannot be undone.`)) return;
  const out = document.getElementById('out-' + slug);
  if (out) out.textContent = dry ? 'dry run…' : 'PUBLISHING LIVE…';
  try {
    const r = await fetch(`/api/ig/publish/${slug}?dry_run=${dry}`, { method: 'POST' });
    const j = await r.json();
    if (out) out.textContent = (j.output || '') + (j.error ? '\n' + j.error : '');
  } catch (e) {
    if (out) out.textContent = 'error: ' + e.message;
  }
  loadIgPipeline();
}
